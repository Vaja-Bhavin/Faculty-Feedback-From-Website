{% extends 'base/base.html' %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}
<main>
    <link rel="stylesheet" href="{{ url_for('static',filename='css/forgot-password.css' ) }}">
    <div class="box-1">
        <div class="box-2">
            <h2>Forgot Password</h2>
            <form action="/forgot-password" method="POST">
                <div class="box-inp">
                    <label for="role">Select Role</label>
                    <select name="role" id="role" required>
                    <option disabled selected>Select Your Role</option>
                    <option value="student">Student</option>
                    <option value="faculty">Faculty</option>
                    <option value="college">College</option>
                </select>
                </div>
                <div class="box-inp">
                    <label for="mail">E-mail</label>
                    <input type="email" id="mail" name="mail" required>
                </div>
                <div class="box-btn" style="justify-content: left;">
                <button class="send-otp" type="submit"><span>Send OTP</span></button>
            </div>
                <div class="box-inp" style="margin-top:18px;">
                    <label for="otp">OTP</label>
                    <input type="number" id="otp" name="otp" required>
                </div>
                <div class="box-btn">
                <button class="sub" type="submit"><span>Next</span></button>
            </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
