{% extends 'base/base.html' %}
{% block title %}
Reset Password
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static',filename='css/student-register.css' ) }}">
<div class="box-1">
    <div class="box-2">
        <h2>Reset Password</h2>
        <form action="{{action}}" method="POST">
            <div class="box-inp">
                <label for="pw">Password</label>
                <input type="password" name="pw" id="pw" required>
            </div>
            <div class="box-inp">
                <label for="cpw">{{title}}</label>
                <input type="password" name="cpw" id="cpw" required>
            </div>
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            {% for msg in messages %}
            <div class="msgdiv">
                <h4 style="text-align: left;">{{msg}}</h4>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <div class="box-btn">
                <button class="sub" type="submit"><span>{{title}}</span></button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
