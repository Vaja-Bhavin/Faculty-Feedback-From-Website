{% extends 'base.html' %}

{% block title %}
Student
{% endblock %}

{% block content %}
{% with messages = get_flashed_messages() %}
    {% if messages %}
    {% for message in messages %}
            <script>
                alert("{{ message }}");
            </script>
        {% endfor %}
    {% endif %}
{% endwith %}
{% endblock %}
